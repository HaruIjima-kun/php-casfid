version: "3.9"

services:
  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: booksapi-swagger
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /usr/share/nginx/html/doc/openapi.yaml
    volumes:
      - ./docs:/usr/share/nginx/html/doc:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:8080"]
      interval: "10s"
      timeout: "3s"
      retries: 5
