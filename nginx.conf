server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;


    location / {
        try_files $uri /index.php$is_args$args;
    }


    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;
    }

    # Servir archivos estáticos de storage
    location /storage/ {
        alias /var/www/html/storage/;
        autoindex off;
        add_header X-Storage "local";
    }


    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
}