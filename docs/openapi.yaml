openapi: 3.0.3
info:
  title: BooksAPI
  version: 1.0.0
  description: |
    BooksAPI – CRUD de libros con enriquecimiento desde Open Library, autenticación JWT,
    paginación, ordenación, búsqueda y rate limiting con Redis.
    - Respuestas con la forma: `{ "data": ..., "meta": ..., "errors": ... }`
    - Paginación por defecto: 20 elementos por página.
    - Rate limiting: por defecto **60 req/min** (cabeceras `X-RateLimit-*`).
servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Health
  - name: Auth
  - name: Books

paths:
  /:
    get:
      tags: [Health]
      summary: Hello
      operationId: hello
      responses:
        '200':
          description: Hello response
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                ok:
                  value:
                    data:
                      message: "Hello from BooksAPI"
                      env: "local"
                    meta:
                      request_id: "8f0f11b9fb5d1c2a"
                    errors: null
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /health:
    get:
      tags: [Health]
      summary: Healthcheck
      operationId: health
      responses:
        '200':
          description: Service health
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                ok:
                  value:
                    data:
                      ok: true
                      name: "BooksAPI"
                      time: "2025-10-18T13:14:27+00:00"
                    meta:
                      request_id: "d9f8d857159029b4"
                    errors: null
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login (JWT)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthLoginRequest' }
            examples:
              admin:
                value: { username: "admin", password: "admin123" }
      responses:
        '200':
          description: JWT pair
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                ok:
                  value:
                    data:
                      access_token: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
                      token_type: "Bearer"
                      expires_in: 3600
                      refresh_token: "82e4a2902a7f6b325..."
                      user:
                        id: "00000000-0000-0000-0000-000000000001"
                        name: "admin"
                        role: "admin"
                    meta:
                      request_id: "b6946aa337de21b5"
                    errors: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/libros:
    get:
      tags: [Books]
      summary: List books (search + pagination + sort)
      operationId: listBooks
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/titulo'
        - $ref: '#/components/parameters/autor'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/direction'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Paginated books
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                page1:
                  value:
                    data:
                      - id: "11111111-1111-1111-1111-111111111111"
                        titulo: "El nombre del viento"
                        autor: "Patrick Rothfuss"
                        isbn: "9788401337208"
                        anio_publicacion: 2007
                        descripcion: "Un joven llamado Kvothe narra su vida."
                        portada_url: "https://covers.openlibrary.org/b/isbn/9788401337208-L.jpg"
                        created_at: "2025-10-18 18:24:23"
                        created_by: "00000000-0000-0000-0000-000000000001"
                        updated_at: null
                        updated_by: null
                        deleted_at: null
                        deleted_by: null
                    meta:
                      page: 1
                      per_page: 20
                      total: 5
                      sort: "titulo"
                      direction: "asc"
                      request_id: "168edadda12c4480"
                    errors: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Books]
      summary: Create book
      operationId: createBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookCreate' }
            examples:
              ok:
                value:
                  titulo: "The Pragmatic Programmer"
                  autor: "Andrew Hunt; David Thomas"
                  isbn: "9780201616224"
                  anio_publicacion: 1999
      responses:
        '201':
          description: Created
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                created:
                  value:
                    data:
                      id: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
                      titulo: "The Pragmatic Programmer"
                      autor: "Andrew Hunt; David Thomas"
                      isbn: "9780201616224"
                      anio_publicacion: 1999
                      descripcion: "A classic software engineering book."
                      portada_url: "https://covers.openlibrary.org/b/isbn/9780201616224-L.jpg"
                    meta:
                      request_id: "abcd1234efef5678"
                      # Si falló el enriquecimiento externo pero se creó:
                      # external_status: 503
                    errors: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/libros/{id}:
    get:
      tags: [Books]
      summary: Get book by id
      operationId: getBook
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: A book
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                ok:
                  value:
                    data:
                      id: "11111111-1111-1111-1111-111111111111"
                      titulo: "El nombre del viento"
                      autor: "Patrick Rothfuss"
                      isbn: "9788401337208"
                      anio_publicacion: 2007
                      descripcion: "Un joven llamado Kvothe narra su vida."
                      portada_url: "https://covers.openlibrary.org/b/isbn/9788401337208-L.jpg"
                      created_at: "2025-10-18 18:24:23"
                      created_by: "00000000-0000-0000-0000-000000000001"
                      updated_at: null
                      updated_by: null
                      deleted_at: null
                      deleted_by: null
                    meta:
                      request_id: "abc123"
                    errors: null
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [Books]
      summary: Update book
      operationId: updateBook
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookUpdate' }
            examples:
              patch:
                value:
                  titulo: "El nombre del viento (ed. revisada)"
      responses:
        '200':
          description: Updated
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                ok:
                  value:
                    data:
                      id: "11111111-1111-1111-1111-111111111111"
                      titulo: "El nombre del viento (ed. revisada)"
                      autor: "Patrick Rothfuss"
                      isbn: "9788401337208"
                      anio_publicacion: 2007
                      descripcion: "Un joven llamado Kvothe narra su vida."
                      portada_url: "https://covers.openlibrary.org/b/isbn/9788401337208-L.jpg"
                    meta:
                      request_id: "abc123"
                      # Si enriquecimiento externo falló:
                      # external_status: 503
                    errors: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Books]
      summary: Delete book (soft/hard by config)
      operationId: deleteBook
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted (no content)
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    q:
      name: q
      in: query
      description: Search in title/author (accent/case-insensitive)
      schema: { type: string, maxLength: 150 }
    titulo:
      name: titulo
      in: query
      description: Filter by title (exact/partial, normalized)
      schema: { type: string, maxLength: 150 }
    autor:
      name: autor
      in: query
      description: Filter by author (exact/partial, normalized)
      schema: { type: string, maxLength: 100 }
    sort:
      name: sort
      in: query
      description: Sort field
      schema:
        type: string
        enum: [titulo, autor, anio_publicacion, created_at]
        default: titulo
    direction:
      name: direction
      in: query
      description: Sort direction
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    page:
      name: page
      in: query
      description: Page number (1-based)
      schema: { type: integer, minimum: 1, default: 1 }
    per_page:
      name: per_page
      in: query
      description: Items per page
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  headers:
    X-RateLimit-Limit:
      description: Maximum requests per minute
      schema: { type: integer, example: 60 }
    X-RateLimit-Remaining:
      description: Remaining requests in current window
      schema: { type: integer, example: 15 }
    X-RateLimit-Reset:
      description: UNIX epoch when the quota resets
      schema: { type: integer, example: 1739973060 }

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          examples:
            unauthorized:
              value:
                data: null
                meta: { request_id: "2ba4d86898272322" }
                errors:
                  - code: UNAUTHORIZED
                    message: Invalid credentials
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          examples:
            notFound:
              value:
                data: null
                meta: { request_id: "4b503d483cf6d851" }
                errors:
                  - code: NOT_FOUND
                    message: Route not found
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          examples:
            dup:
              value:
                data: null
                meta: { request_id: "8340b41f7ff2418e" }
                errors:
                  - code: CONFLICT
                    message: "ISBN ya existe"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          examples:
            invalid-isbn:
              value:
                data: null
                meta: { request_id: "a73d764e0841d800" }
                errors:
                  - code: VALIDATION_ERROR
                    message: "Errores de validación"
                    details:
                      isbn: "inválido"
    TooManyRequests:
      description: Too many requests
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          examples:
            limited:
              value:
                data: null
                meta: {}
                errors:
                  - code: RATE_LIMITED
                    message: Too many requests
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          examples:
            error:
              value:
                data: null
                meta: { request_id: "xxx" }
                errors:
                  - code: INTERNAL_ERROR
                    message: "Unexpected error"

  schemas:
    Envelope:
      type: object
      required: [data, meta, errors]
      properties:
        data:
          nullable: true
        meta:
          type: object
          additionalProperties: true
          description: Extra metadata (e.g., pagination, request_id, external_status)
        errors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ErrorItem'

    ErrorItem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
        trace:
          type: array
          items: { type: string }

    Book:
      type: object
      required: [id, titulo, autor, isbn, created_at, created_by]
      properties:
        id:        { type: string, format: uuid }
        titulo:    { type: string, maxLength: 150 }
        autor:     { type: string, maxLength: 100 }
        isbn:      { type: string, maxLength: 13, description: "ISBN-10/13 valid" }
        anio_publicacion:
          type: integer
          nullable: true
        descripcion:
          type: string
          nullable: true
          maxLength: 2000
        portada_url:
          type: string
          nullable: true
          maxLength: 512
        created_at: { type: string }
        created_by: { type: string, format: uuid }
        updated_at:
          type: string
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
        deleted_at:
          type: string
          nullable: true
        deleted_by:
          type: string
          format: uuid
          nullable: true

    BookCreate:
      type: object
      required: [titulo, autor, isbn]
      properties:
        titulo: { type: string, maxLength: 150 }
        autor:  { type: string, maxLength: 100 }
        isbn:   { type: string, description: "ISBN-10/13" }
        anio_publicacion:
          type: integer
          nullable: true
        descripcion:
          type: string
          nullable: true
          maxLength: 2000
        portada_url:
          type: string
          nullable: true
          maxLength: 512

    BookUpdate:
      type: object
      properties:
        titulo: { type: string, maxLength: 150 }
        autor:  { type: string, maxLength: 100 }
        isbn:   { type: string, description: "ISBN-10/13" }
        anio_publicacion:
          type: integer
          nullable: true
        descripcion:
          type: string
          nullable: true
          maxLength: 2000
        portada_url:
          type: string
          nullable: true
          maxLength: 512

    AuthLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    AuthLoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 3600 }
        refresh_token: { type: string }
        user:
          type: object
          required: [id, name, role]
          properties:
            id:   { type: string, format: uuid }
            name: { type: string }
            role: { type: string, enum: [usuario, admin] }
