openapi: 3.0.3
info:
  title: BooksAPI
  version: 1.0.0
  description: |
    API para gestión de libros con enriquecimiento desde OpenLibrary y portadas locales.
    - Autenticación: JWT (Bearer).
    - Paginación por defecto: 20 por página (configurable).
    - Caché de respuestas GET con Redis (X-Cache: HIT/MISS).
    - Rate limiting por IP/token con Redis (X-RateLimit-*).
servers:
  - url: http://localhost:8080
    description: Local (Docker)

tags:
  - name: Auth
  - name: Libros
  - name: Salud

paths:
  /:
    get:
      tags: [Salud]
      summary: Ping API
      operationId: ping
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                ok:
                  value:
                    data: { message: "Hello from BooksAPI", env: "local" }
                    meta: { request_id: "abcd1234ef" }
                    errors: null

  /health:
    get:
      tags: [Salud]
      summary: Health check
      operationId: health
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              schema: { type: string }
            X-Cache:
              schema: { type: string, enum: [HIT, MISS] }
            X-RateLimit-Limit:
              schema: { type: integer }
            X-RateLimit-Remaining:
              schema: { type: integer }
            X-RateLimit-Reset:
              schema: { type: integer, description: "Unix epoch seconds to reset window" }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                ok:
                  value:
                    data: { ok: true, name: "BooksAPI", time: "2025-10-18T13:14:27+00:00" }
                    meta: { request_id: "d9f8d857159029b4" }
                    errors: null

  /auth/login:
    post:
      tags: [Auth]
      summary: Login y obtención de tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, example: admin123 }
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                ok:
                  value:
                    data:
                      access_token: "eyJ0eXAiOiJKV1QiL..."
                      token_type: "Bearer"
                      expires_in: 3600
                      refresh_token: "82e4a2902a7f6b3..."
                      user:
                        id: "00000000-0000-0000-0000-000000000001"
                        name: "admin"
                        role: "admin"
                    meta: { request_id: "b6946aa337de21b5" }
                    errors: null
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                invalid:
                  value:
                    data: null
                    meta: {}
                    errors:
                      - code: UNAUTHORIZED
                        message: Invalid credentials

  /api/v1/libros:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Libros]
      summary: Listado y búsqueda de libros
      operationId: listBooks
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Búsqueda por título o autor (normalizada, sin acentos).
        - in: query
          name: titulo
          schema: { type: string }
          description: Búsqueda específica por título (normalizada).
        - in: query
          name: autor
          schema: { type: string }
          description: Búsqueda específica por autor (normalizada).
        - in: query
          name: sort
          schema:
            type: string
            enum: [titulo, autor, anio_publicacion, created_at]
            default: titulo
        - in: query
          name: direction
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id: { schema: { type: string } }
            X-Cache: { schema: { type: string, enum: [HIT, MISS] } }
            X-RateLimit-Limit: { schema: { type: integer } }
            X-RateLimit-Remaining: { schema: { type: integer } }
            X-RateLimit-Reset: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeBooksList' }
              examples:
                page1:
                  value:
                    data:
                      - id: "33333333-3333-3333-3333-333333333333"
                        titulo: "La comunidad del anillo"
                        autor: "J. R. R. Tolkien"
                        isbn: "9788445071438"
                        anio_publicacion: 1954
                        descripcion: "Primera parte de El Señor de los Anillos."
                        portada_url: "https://covers.openlibrary.org/b/isbn/9788445071438-L.jpg"
                        portada_path: "/storage/covers/9788445071438_9a8b7c6d.jpg"
                        created_at: "2025-10-18 18:24:23"
                        created_by: "00000000-0000-0000-0000-000000000001"
                        updated_at: null
                        updated_by: null
                        deleted_at: null
                        deleted_by: null
                    meta:
                      page: 1
                      per_page: 20
                      total: 5
                      sort: "titulo"
                      direction: "asc"
                      request_id: "168edadda12c4480"
                    errors: null
        '401':
          description: No autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '429':
          description: Límite excedido
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    post:
      security: [{ bearerAuth: [] }]
      tags: [Libros]
      summary: Crear un libro
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, autor, isbn]
            examples:
              ejemplo:
                value:
                  titulo: "Clean Code"
                  autor: "Robert C. Martin"
                  isbn: "9780132350884"
      responses:
        '201':
          description: Creado
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeBook' }
              examples:
                ok:
                  value:
                    data:
                      id: "832463f3-a42b-4bfe-8f4d-c1471e5b5c12"
                      titulo: "Clean Code"
                      autor: "Robert C. Martin"
                      isbn: "9780132350884"
                      anio_publicacion: 2008
                      descripcion: null
                      portada_url: "https://covers.openlibrary.org/b/id/15126503-L.jpg"
                      portada_path: "/storage/covers/9780132350884_e1e49bef.jpg"
                    meta: { request_id: "c677edf332656172" }
                    errors: null
        '400':
          description: Error de validación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              examples:
                invalid:
                  value:
                    data: null
                    meta: { request_id: "a73d764e0841d800" }
                    errors:
                      - code: VALIDATION_ERROR
                        message: "Errores de validación"
                        details: { isbn: "inválido" }
        '401':
          description: No autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '409':
          description: Conflicto (ISBN existente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/v1/libros/{id}:
    get:
      security: [{ bearerAuth: [] }]
      tags: [Libros]
      summary: Obtener un libro por ID
      operationId: getBook
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id: { schema: { type: string } }
            X-Cache: { schema: { type: string, enum: [HIT, MISS] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeBook' }
        '404':
          description: No encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    put:
      security: [{ bearerAuth: [] }]
      tags: [Libros]
      summary: Actualizar libro (con refresh opcional de portada)
      operationId: updateBook
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: refresh_cover
          in: query
          required: false
          schema: { type: string, enum: ['0','1'], default: '0' }
          description: Si vale 1, fuerza re-descarga de portada local desde la URL remota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Cualquiera de los campos, al menos uno."
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeBook' }
        '400':
          description: Validación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: No encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '409':
          description: Conflicto (ISBN existente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    delete:
      security: [{ bearerAuth: [] }]
      tags: [Libros]
      summary: Eliminar libro (soft/hard según config)
      operationId: deleteBook
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: No Content
        '404':
          description: No encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Envelope:
      type: object
      required: [data, meta, errors]
      properties:
        data: {}
        meta:
          type: object
          additionalProperties: true
          description: Metadatos como request_id, paginación, etc.
        errors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Error'

    EnvelopeBook:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Book'

    EnvelopeBooksList:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Book' }
            meta:
              type: object
              required: [page, per_page, total, sort, direction, request_id]
              properties:
                page: { type: integer }
                per_page: { type: integer }
                total: { type: integer }
                sort: { type: string }
                direction: { type: string, enum: [asc, desc] }
                request_id: { type: string }

    Book:
      type: object
      required: [id, titulo, autor, isbn, created_at, created_by]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string, maxLength: 150 }
        autor: { type: string, maxLength: 100 }
        isbn: { type: string, description: "ISBN-10 o ISBN-13 (validado)" }
        anio_publicacion: { type: integer, nullable: true }
        descripcion: { type: string, nullable: true, maxLength: 2000 }
        portada_url: { type: string, nullable: true, format: uri, description: "URL remota (OpenLibrary u otros)" }
        portada_path: { type: string, nullable: true, description: "Ruta pública local (servida por Nginx), p.ej. /storage/covers/xxx.jpg" }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        deleted_by: { type: string, format: uuid, nullable: true }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          nullable: true
